<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Reproductor de Música</title>
  <style>
    /* Fondo oscuro con un toque moderno */
    body {
      background: linear-gradient(135deg, #121212, #141414);
      color: #fff;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Estilo del reproductor */
    .player {
      text-align: center;
      background: rgba(30, 30, 30, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px 5px rgba(0, 242, 255, 0.5);
      width: 350px;
      backdrop-filter: blur(5px); /* Efecto de difuminado detrás */
      transform: scale(1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Animación de aumento del reproductor */
    .player:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px 10px rgba(0, 242, 255, 0.8);
    }

    /* Imagen de portada con efecto de borde */
    img {
      border-radius: 15px;
      margin-bottom: 20px;
      width: 200px;
      height: 200px;
      box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    /* Título de la canción */
    h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #00f2ff;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Estilo del título de la canción */
    h2 {
      font-size: 18px;
      color: #11e2d8;
      font-weight: 400;
      margin: 10px 0;
    }

    /* Botones con estilo interactivo */
    .controls button {
      background: linear-gradient(135deg, #00f2ff, #00bcd4);
      border: none;
      color: #000;
      padding: 12px 25px;
      margin: 15px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 10px rgba(196, 6, 235, 0.5);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    /* Efecto cuando se pasa el mouse sobre el botón */
    .controls button:hover {
      background: linear-gradient(135deg, #00bcd4, #00f2ff);
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 242, 255, 0.7);
    }

    /* Efecto de transición suave al pausar */
    .controls button:active {
      transform: scale(0.95);
      box-shadow: 0 2px 5px rgba(0, 242, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="player">
    <h1>🎶 Mi Música</h1>
    <img src="https://via.placeholder.com/200x200?text=Album" alt="Portada del álbum" id="album-cover">
    <h2 id="song-title">MusicJTV</h2>
    <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <div class="controls">
      <button onclick="playSong()">▶️ Reproducir</button>
      <button onclick="pauseSong()">⏸️ Pausar</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById("audio");

    // Función para reproducir la canción
    function playSong() {
      audio.play();
    }

    // Función para pausar la canción
    function pauseSong() {
      audio.pause();
    }
  </script>
</body>
</html>
